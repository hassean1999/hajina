name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ccr-f654510f-cjacr3, main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          AG: ${{ secrets.AGORA_APP_ID }}
        run: |
          [ -n "$GS" ] || { echo "::error::Missing secret GOOGLE_SERVICES_JSON_BASE64 (see README)"; exit 1; }
          [ -n "$AG" ] || { echo "::error::Missing secret AGORA_APP_ID (see README)"; exit 1; }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.hajina --project-name live_app

      - name: Add google-services.json and plugin
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import re,os
          # settings plugin
          for f in ('android/settings.gradle.kts','android/settings.gradle'):
              if os.path.exists(f):
                  s=open(f).read()
                  if 'com.google.gms.google-services' not in s:
                      kts=f.endswith('.kts')
                      line='    id("com.google.gms.google-services") version "4.4.2" apply false\n' if kts else '    id "com.google.gms.google-services" version "4.4.2" apply false\n'
                      s=re.sub(r'(plugins\s*\{\n)', r'\1'+line.replace('\\','\\\\'), s, count=1) if re.search(r'plugins\s*\{\n',s) else s
                      open(f,'w').write(s)
          # app plugin + minSdk
          for f in ('android/app/build.gradle.kts','android/app/build.gradle'):
              if os.path.exists(f):
                  s=open(f).read()
                  kts=f.endswith('.kts')
                  line='    id("com.google.gms.google-services")\n' if kts else '    id "com.google.gms.google-services"\n'
                  s=re.sub(r'(plugins\s*\{\n)', r'\1'+line, s, count=1)
                  s=re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion','minSdk = 23',s)
                  s=re.sub(r'minSdkVersion\s+flutter\.minSdkVersion','minSdkVersion 23',s)
                  open(f,'w').write(s)
          # permissions
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          perms='<uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
          if 'RECORD_AUDIO' not in s:
              s=s.replace('<application',perms+'<application',1)
              open(m,'w').write(s)
          PY

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: LiveApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
