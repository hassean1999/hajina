name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@6.1.0

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r docs/. android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Setup Android SDK
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true
          echo "✅ Android SDK ready"

      - name: Override google-services.json from secret (if set)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ Used google-services.json from secret"
          else
            echo "ℹ️ Using default google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Setup Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          # Download gradle-wrapper.jar from gradle v8.6
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --warning-mode none
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Show APK info
        run: |
          find android -name "*.apk" 2>/dev/null && echo "APK found!" || echo "No APK"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajina-debug-build${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: "📱 حجينه - تحديث ${{ github.run_number }}"
          body: |
            ## 📥 حمّل تطبيق حجينه

            ### كيفية التثبيت:
            1. اضغط على `app-debug.apk` أدناه لتحميله
            2. افتح **الإعدادات** ← **الأمان** ← فعّل **"مصادر غير معروفة"**
            3. افتح الملف المحمّل وثبّت التطبيق

            ### المميزات:
            - 🎙️ غرف صوتية مع مقاعد المايك
            - 🎁 نظام الهدايا والألماس والتشغيل الجماعي
            - 👑 مؤثرات الدخول (6 تأثيرات)
            - 🖼️ إطارات الملف الشخصي (6 إطارات)
            - 🏆 نادي الروم بمهام وليدربورد
            - 🎮 ألعاب: السكاكين، الكلمات، تخمين الصوت
            - 📸 ألبوم الصور (9 صور)
            - 🏅 نظام الشارات التلقائية
            - 💑 نظام CP

            ---
            > **يعمل على:** Android 5.1+ (API 22 وأعلى)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
