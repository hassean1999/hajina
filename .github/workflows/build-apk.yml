name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@6.1.0

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r docs/. android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Setup Android SDK
        run: |
          # Find Android SDK location on ubuntu-latest
          ANDROID_SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV

          # Accept licenses
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # Install required packages
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" 2>/dev/null || true

          echo "✅ Android SDK ready at $ANDROID_SDK"

      - name: Override google-services.json from secret (if set)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ Used google-services.json from secret"
          else
            echo "ℹ️ Using default google-services.json (already in repo)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --warning-mode none \
            --info 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Show APK info
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully!"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found!"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajina-debug-build${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: "📱 حجينه - تحديث ${{ github.run_number }}"
          body: |
            ## 📥 حمّل تطبيق حجينه

            ### كيفية التثبيت:
            1. اضغط على `app-debug.apk` أدناه لتحميله
            2. افتح **الإعدادات** ← **الأمان** ← فعّل **"مصادر غير معروفة"**
            3. افتح الملف المحمّل وثبّت التطبيق

            ### المميزات في هذا الإصدار:
            - 🎙️ غرف صوتية مع مقاعد المايك
            - 🎁 نظام الهدايا والألماس والتشغيل الجماعي
            - 👑 مؤثرات الدخول (6 تأثيرات)
            - 🖼️ إطارات الملف الشخصي (6 إطارات)
            - 🏆 نادي الروم بمهام وليدربورد
            - 🎮 ألعاب: السكاكين، الكلمات، تخمين الصوت
            - 📸 ألبوم الصور (9 صور)
            - 🏅 نظام الشارات التلقائية
            - 💑 نظام CP

            ---
            > **يعمل على:** Android 5.1+ (API 22 وأعلى)
            > **الحجم التقريبي:** ~15 ميغابايت
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
