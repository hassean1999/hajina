name: Build APK
on:
  push:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease bundleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Hajina.apk && cp app/build/outputs/bundle/release/app-release.aab Hajina-PlayStore.aab
      - uses: actions/upload-artifact@v4
        with: { name: Hajina-APK, path: Hajina.apk }
      - uses: actions/upload-artifact@v4
        with: { name: Hajina-PlayStore-AAB, path: Hajina-PlayStore.aab }
