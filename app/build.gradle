plugins { id 'com.android.application' }
android {
    namespace 'com.hajina.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hajina.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }
    signingConfigs {
        hajina {
            storeFile file('hajina.keystore')
            storePassword 'hajina2026'
            keyAlias 'hajina'
            keyPassword 'hajina2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.hajina }
        release { minifyEnabled false; signingConfig signingConfigs.hajina }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
